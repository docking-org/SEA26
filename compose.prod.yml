# Production compose — standalone
# Usage: docker compose -f compose.prod.yml up --build -d
name:
  sea
services:
#### REDIS ####
  redis:
    image: redis:latest
    # container_name: sea-redis
    restart: unless-stopped
    networks:
      - ocean
    command: redis-server --port ${REDIS_PORT}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

#### REDIS BEAT SCHEDULER ####
  redisbeat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    # container_name: sea-redisbeat
    user: "1020:1020"
    restart: unless-stopped
    networks:
      - ocean
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.app.celery_worker beat -l info -s /tmp/sea-celerybeat-schedule

#### WEB APPLICATION ####
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - VITE_CHEMBL_VERSION=${VITE_CHEMBL_VERSION}
    # container_name: sea-web
    user: "1020:1020"
    restart: unless-stopped
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    env_file:
      - .env
    command: uvicorn backend.app.api:app --host 0.0.0.0 --port 5050 --workers 5 --proxy-headers
    volumes:
      - ${SEA_DATA_FOLDER}:${SEA_DATA_FOLDER}
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}

#### REDIS WORKER ####
  redisworker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    # container_name: sea-redisworker
    user: "1020:1020"
    restart: unless-stopped
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: celery -A backend.app.celery_worker worker -n sea-worker -Q celery,sea-slot-0,sea-slot-1,sea-slot-2,sea-slot-3 --loglevel=debug --concurrency=32 --max-tasks-per-child=100 --prefetch-multiplier=1
    volumes:
      - ${SEA_DATA_FOLDER}:${SEA_DATA_FOLDER}
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}

#### BOLTZ WORKERS — one per GPU ####
  x-boltzworker: &boltzworker-base
    build:
      context: .
      dockerfile: Dockerfile.prod
    user: "1020:1020"
    runtime: nvidia
    restart: unless-stopped
    shm_size: '15gb'
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - USER=www
      - NVIDIA_VISIBLE_DEVICES=0   # remapped to 0 inside container by Docker
      - BOLTZ_CUDA_DEVICES=0
      - BOLTZ_NUM_GPUS=${BOLTZ_NUM_GPUS:-4}
    volumes:
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}
      - /nfs/home/khtang/.conda/envs/sea25:/nfs/home/khtang/.conda/envs/sea25:ro
      - /scratch/sea_boltz:/scratch/sea_boltz

  boltzworker-gpu0:
    <<: *boltzworker-base
    command: celery -A backend.app.celery_worker worker -n boltzworker-gpu0@%h -Q boltz-gpu0 --concurrency=1 --pool solo --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  boltzworker-gpu1:
    <<: *boltzworker-base
    command: celery -A backend.app.celery_worker worker -n boltzworker-gpu1@%h -Q boltz-gpu1 --concurrency=1 --pool solo --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  boltzworker-gpu2:
    <<: *boltzworker-base
    command: celery -A backend.app.celery_worker worker -n boltzworker-gpu2@%h -Q boltz-gpu2 --concurrency=1 --pool solo --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  boltzworker-gpu3:
    <<: *boltzworker-base
    command: celery -A backend.app.celery_worker worker -n boltzworker-gpu3@%h -Q boltz-gpu3 --concurrency=1 --pool solo --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]


##### ----- NETWORKS ------ #####
networks:
  ocean:
    driver: bridge

##### ----- VOLUMES ----- #####
volumes:
  beat_scheduler:
