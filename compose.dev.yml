# Development compose — standalone
# Usage: docker compose -f compose.dev.yml up --build
name:
  sea-dev
services:
#### REDIS ####
  redis:
    image: redis:latest
    # container_name: sea-redis
    restart: unless-stopped
    networks:
      - ocean
    command: redis-server --port ${REDIS_PORT}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

#### REDIS BEAT SCHEDULER ####
  redisbeat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # container_name: sea-redisbeat
    user: "1020:1020"
    restart: unless-stopped
    networks:
      - ocean
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.app.celery_worker beat -l info -s /tmp/sea-celerybeat-schedule

#### WEB APPLICATION ####
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - VITE_CHEMBL_VERSION=${VITE_CHEMBL_VERSION}
    # container_name: sea-web
    user: "1020:1020"
    restart: unless-stopped
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5055:5055"
    command: uvicorn backend.app.api:app --host 0.0.0.0 --port 5055 --reload --proxy-headers 
    volumes:
      - ./backend:/home/sea/backend
      - ${SEA_DATA_FOLDER}:${SEA_DATA_FOLDER}
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}

#### REDIS WORKER ####
  redisworker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # container_name: sea-redisworker
    user: "1020:1020"
    restart: unless-stopped
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: celery -A backend.app.celery_worker worker -n sea-worker --loglevel=info --concurrency=10 --max-tasks-per-child=10
    volumes:
      - ./backend:/home/sea/backend
      - ${SEA_DATA_FOLDER}:${SEA_DATA_FOLDER}
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}

#### BOLTZ WORKER (concurrency=1 — one job at a time) ####
  boltzworker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # container_name: sea-boltzworker
    runtime: nvidia
    user: "1020:1020"
    restart: unless-stopped
    shm_size: '15gb'
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - USER=www
      - NVIDIA_VISIBLE_DEVICES=2
    command: celery -A backend.app.celery_worker worker -n boltzworker -Q boltz --concurrency=1 --pool solo --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    volumes:
      - ./backend:/home/sea/backend
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}
      - /nfs/home/khtang/.conda/envs/sea25:/nfs/home/khtang/.conda/envs/sea25:ro
      - /scratch/sea_boltz:/scratch/sea_boltz

##### ----- NETWORKS ------ #####
networks:
  ocean:
    driver: bridge

##### ----- VOLUMES ----- #####
volumes:
  beat_scheduler:
