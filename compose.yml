# Base compose — shared service definitions.
# Use with an override file:
#   Dev:  docker compose -f compose.yml -f compose.dev.yml up --build
#   Prod: docker compose -f compose.yml -f compose.prod.yml up --build -d

services:
#### REDIS ####
  redis:
    image: redis:latest
    container_name: sea-redis
    restart: unless-stopped
    networks:
      - ocean
    command: redis-server --port ${REDIS_PORT}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s


#### REDIS BEAT SCHEDULER ####
  redisbeat:
    container_name: sea-redisbeat
    restart: unless-stopped
    networks:
      - ocean
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.app.celery_worker beat -l info -s /tmp/sea-celerybeat-schedule
    volumes:
      - beat_scheduler:/tmp


#### WEB APPLICATION ####
  web:
    container_name: sea-web
    restart: unless-stopped
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SEA_DATA_FOLDER=${SEA_DATA_FOLDER}
      - SEA_JOB_DIR=${SEA_JOB_DIR}
      - ALTCHA_HMAC_SECRET=${ALTCHA_HMAC_SECRET}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE}
      - SEA_NUM_SLOTS=${SEA_NUM_SLOTS:-4}
    volumes:
      - ${SEA_DATA_FOLDER}:${SEA_DATA_FOLDER}
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}

#### REDIS WORKER ####
  redisworker:
    container_name: sea-redisworker
    restart: unless-stopped
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SEA_JOB_DIR=${SEA_JOB_DIR}
      - SEA_DATA_FOLDER=${SEA_DATA_FOLDER}
    volumes:
      - ${SEA_DATA_FOLDER}:${SEA_DATA_FOLDER}
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}

#### BOLTZ WORKER (concurrency=1 — one job at a time) ####
  boltzworker:
    container_name: sea-boltzworker
    restart: unless-stopped
    shm_size: '8gb'
    networks:
      - ocean
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SEA_JOB_DIR=${SEA_JOB_DIR}
      - BOLTZ_BIN=${BOLTZ_BIN}
      - BOLTZ_MAX_QUEUED=${BOLTZ_MAX_QUEUED:-10}
      - BOLTZ_NUM_GPUS=${BOLTZ_NUM_GPUS:-4}
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CONFIG_HOME=/tmp/xdg_config
      - TRITON_CACHE_DIR=/tmp/triton_cache
    volumes:
      - ${SEA_JOB_DIR}:${SEA_JOB_DIR}
      - /scratch/sea_boltz:/scratch/sea_boltz
    command: celery -A backend.app.celery_worker worker -n boltzworker -Q boltz-gpu0,boltz-gpu1,boltz-gpu2,boltz-gpu3 --concurrency=1 --loglevel=info



##### ----- NETWORKS ------ #####
networks:
  ocean:
    driver: bridge


##### ----- VOLUMES ----- #####
volumes:
  beat_scheduler:
